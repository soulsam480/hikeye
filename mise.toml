[tools]
python = "3.13"

[tasks.setup]
description = "Install Python + UI dependencies and build CSS"
run = "uv sync --extra dev && npm install && npm run build:css"

[tasks."css:build"]
description = "Build the Tailwind stylesheet"
run = "npm run build:css"

[tasks."css:watch"]
description = "Watch Tailwind templates and rebuild CSS"
run = "npm run watch:css"

[tasks.start]
description = "Start the dashboard"
run = "uv run netra serve"

[tasks.check]
description = "Check the DVR, credentials and first camera"
run = "uv run netra check"

[tasks.test]
description = "Run the unit tests"
run = "uv run pytest"

[tasks.lint]
description = "Lint, format-check and type-check the app"
run = "uv run ruff check netra tests && uv run ruff format --check netra tests && uv run ty check netra tests"

[tasks.typecheck]
description = "Type-check the app with ty"
run = "uv run ty check netra tests"

[tasks.dev]
description = "Restart the app on file changes"
run = "uv run watchfiles 'uv run netra serve' netra"
